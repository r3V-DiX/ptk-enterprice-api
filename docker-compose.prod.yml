services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "8002:8002"
    env_file: .env.prod
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8002 --workers 2 --log-config log_config.json"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.prod
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery_app worker -Q enterprise_scans -l info --concurrency 2

  beat:
    image: ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.prod
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_worker.celery_app beat -l info
